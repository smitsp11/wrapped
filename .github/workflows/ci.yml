name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS, because the app reads macOS files and the installer tests use macOS tools (shasum, sysctl).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install chromium webkit
      - run: npm run e2e
