<!doctype html>
<!--
  The 1200×630 link-preview image (web/public/og.png), in the Scrapbook style.
  Every number and name is from the made-up "Poker Night" demo chat. Rebuild with: npm run og
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Bricolage Grotesque'; font-weight: 500; src: url(../../web/public/fonts/bricolage-grotesque-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Bricolage Grotesque'; font-weight: 800; src: url(../../web/public/fonts/bricolage-grotesque-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Caveat'; font-weight: 700; src: url(../../web/public/fonts/caveat-latin-700-normal.woff2) format('woff2'); }
  :root {
    --paper: #F6EEDF; --ink: #2B2118; --muted: #5C4A3A; --orange: #C2410C; --blue: #1D4ED8;
    --tape: rgba(255, 214, 102, 0.75); --shadow: 0 2px 0 rgba(43, 33, 24, 0.15);
    --body: 'Bricolage Grotesque', system-ui, sans-serif; --hand: 'Caveat', cursive;
  }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); font: 500 20px/1.4 var(--body); position: relative; }
  .tape { position: absolute; background: var(--tape); }
  .copy { position: absolute; left: 72px; top: 70px; width: 600px; }
  .kicker { font-size: 18px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .beta { margin-left: 8px; padding: 2px 10px; border: 2px solid currentColor; border-radius: 999px; font-size: 13px; vertical-align: 2px; }
  h1 { margin-top: 18px; font-size: 104px; font-weight: 800; line-height: 0.9; letter-spacing: -0.04em; }
  .hand { font-family: var(--hand); font-weight: 700; }
  h1 .hand { display: block; margin-top: 14px; font-size: 64px; letter-spacing: 0; color: var(--orange); transform: rotate(-2deg); transform-origin: left; }
  .lede { margin-top: 26px; font-size: 26px; max-width: 520px; }
  .url { position: absolute; left: 72px; bottom: 52px; font-size: 22px; font-weight: 800; }
  .url span { color: var(--muted); font-weight: 500; }
  .polaroid { position: absolute; left: 676px; top: 58px; background: #fff; padding: 16px 16px 12px; box-shadow: 0 8px 22px rgba(43, 33, 24, 0.16); transform: rotate(3deg); }
  .photo { width: 230px; height: 200px; background: var(--ink); color: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .photo b { font-size: 104px; font-weight: 800; line-height: 0.9; letter-spacing: -0.04em; }
  /* padding-right keeps the caption clear of the rank card that overlaps the polaroid's right edge */
  .polaroid p { text-align: center; font-size: 30px; margin-top: 8px; padding-right: 28px; }
  .row { position: absolute; display: grid; grid-template-columns: 26px 120px 70px; column-gap: 12px; row-gap: 6px; align-items: center; background: #fff; padding: 10px 16px; box-shadow: var(--shadow); }
  .row .rank { grid-row: 1 / 3; font: 700 30px/1 var(--hand); }
  .row .name { font-size: 20px; font-weight: 800; line-height: 1.1; }
  .row .bar { height: 9px; border-radius: 9px; background: rgba(43, 33, 24, 0.1); overflow: hidden; }
  .row .bar i { display: block; height: 100%; border-radius: inherit; }
  .row .pct { grid-row: 1 / 3; grid-column: 3; text-align: right; font-size: 21px; font-weight: 800; }
  .stamp { position: absolute; left: 720px; top: 392px; width: 196px; height: 196px; border-radius: 50%; background: var(--ink); color: #FDE2E4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; outline: 3px dashed var(--ink); outline-offset: 7px; transform: rotate(-7deg); text-align: center; }
  .stamp small { font-size: 12px; letter-spacing: 0.14em; }
  .stamp strong { font-size: 30px; font-weight: 800; line-height: 0.95; }
  .note { position: absolute; right: 56px; bottom: 34px; font-size: 26px; color: var(--muted); transform: rotate(-3deg); }
</style>
</head>
<body>
  <div class="copy">
    <p class="kicker"><span class="beta">Beta</span></p>
    <h1>iMessage Wrapped <span class="hand">for your group chats</span></h1>
    <p class="lede">Made on your Mac. Nothing is uploaded. Watch it on any phone.</p>
  </div>
  <p class="url">wrapped.smitpatel.xyz <span>· Mac only for making</span></p>

  <div class="polaroid">
    <div class="tape" style="left: 70px; top: -14px; width: 120px; height: 30px; transform: rotate(-5deg)"></div>
    <div class="photo"><b>302</b><span>messages</span></div>
    <p class="hand">Poker Night</p>
  </div>
  <div class="row" style="left: 872px; top: 262px; transform: rotate(-1.5deg)">
    <span class="rank" style="color: var(--orange)">1</span><span class="name">Alex</span>
    <span class="bar"><i style="width: 100%; background: var(--orange)"></i></span><span class="pct">29.8%</span>
  </div>
  <div class="row" style="left: 890px; top: 344px; transform: rotate(1.2deg)">
    <span class="rank" style="color: var(--blue)">2</span><span class="name">You</span>
    <span class="bar"><i style="width: 89%; background: var(--blue)"></i></span><span class="pct">26.5%</span>
  </div>
  <div class="stamp"><small>CERTIFIED</small><strong>Main<br />Character</strong><small>2026</small></div>
  <p class="note hand">(a made-up demo chat)</p>
</body>
</html>
